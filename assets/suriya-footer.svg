<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Learning, Building, Innovating</title>
  <desc id="desc">Black and orange footer banner signed Sanjay Suriya E.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0d"/>
      <stop offset="1" stop-color="#17110b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff8a00" stroke-opacity=".10"/>
    </pattern>
  </defs>
  <rect width="1200" height="160" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="160" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <g fill="none" stroke="#ff8a00" stroke-opacity=".6">
    <circle cx="72" cy="80" r="28"/>
    <circle cx="72" cy="80" r="18" stroke-dasharray="3 5"/>
    <path d="M43 80h58M72 51v58"/>
    <circle cx="1125" cy="80" r="28"/>
    <circle cx="1125" cy="80" r="18" stroke-dasharray="3 5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="65" fill="#ff9a2e" font-size="15" font-weight="700" letter-spacing="5">LEARNING · BUILDING · INNOVATING</text>
    <text x="600" y="105" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="2">SANJAY SURIYA E</text>
    <text x="600" y="132" fill="#a9a9a9" font-size="11" letter-spacing="3">KEEP BUILDING. KEEP IMPROVING.</text>
  </g>
</svg>
